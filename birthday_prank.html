<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Access</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Consolas, monospace;
}

body{
    background:black;
    overflow:hidden;
    color:#00ff66;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:-1;
}

.container{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:20px;
}

.hacker-box{
    border:2px solid #00ff66;
    width:90%;
    max-width:700px;
    padding:30px;
    background:rgba(0,0,0,0.85);
    box-shadow:0 0 20px #00ff66;
    border-radius:15px;
}

.line{
    margin:12px 0;
    font-size:20px;
}

.progress{
    width:100%;
    height:25px;
    border:1px solid #00ff66;
    margin-top:25px;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#00ff66;
    animation:load 2s linear forwards;
}

@keyframes load{
    from{width:0%;}
    to{width:100%;}
}

.hidden{
    display:none;
}

.birthday{
    color:#ff4da6;
    text-shadow:0 0 15px #ff4da6;
    animation:fadeIn 1.5s ease forwards;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:scale(0.8);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.birthday h1{
    font-size:65px;
    margin-bottom:20px;
}

.birthday p{
    font-size:24px;
    line-height:1.7;
}

.heart{
    font-size:80px;
    animation:float 2s infinite;
}

@keyframes float{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0px);}
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="container">

    <!-- HACK SCREEN -->
    <div class="hacker-box" id="hackScreen">

        <div class="line">> Initializing access...</div>
        <div class="line">> Bypassing firewall...</div>
        <div class="line">> Decrypting secret files...</div>
        <div class="line">> Accessing private memories...</div>
        <div class="line">> Finding cutest person alive...</div>
        <div class="line">> SUCCESS ❤️</div>

        <div class="progress">
            <div class="progress-bar"></div>
        </div>

    </div>

    <!-- BIRTHDAY SCREEN -->
    <div class="birthday hidden" id="birthdayScreen">

        <div class="heart">🎂❤️</div>

        <h1>HAPPY BIRTHDAY</h1>

        <p>
            You have successfully hacked my heart forever 💖
            <br><br>
            Wishing you unlimited happiness, love and smiles today ✨
        </p>

    </div>

</div>

<script>

// MATRIX EFFECT
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

const letters = "01";
const fontSize = 14;
const columns = canvas.width/fontSize;

const drops = [];

for(let x = 0; x < columns; x++)
    drops[x] = 1;

function draw(){
    ctx.fillStyle = "rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#00ff66";
    ctx.font = fontSize + "px monospace";

    for(let i = 0; i < drops.length; i++){
        const text = letters[Math.floor(Math.random()*letters.length)];

        ctx.fillText(text, i*fontSize, drops[i]*fontSize);

        if(drops[i]*fontSize > canvas.height && Math.random() > 0.975)
            drops[i] = 0;

        drops[i]++;
    }
}

setInterval(draw, 35);

// SWITCH SCREEN AFTER 2 SECONDS
setTimeout(() => {
    document.getElementById("hackScreen").classList.add("hidden");
    document.getElementById("birthdayScreen").classList.remove("hidden");
}, 2200);

</script>

</body>
</html>
